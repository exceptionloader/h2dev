# =====================================================================
#  Schatzkisten im Nether und in der Farmwelt (/schatz) - Inhalt
#  Jede Kiste: common-rolls Eintraege aus "gewoehnlich" und mit Glueck ein Bonus aus einer hoeheren Stufe.
#  Der Schatz-Token wird extra ausgewuerfelt (config.yml -> treasure.token).
#
#  Eintrag (weight = wie oft im Vergleich zu den anderen der Stufe):
#    item: <Material>, amount: [min, max]     Minecraft-Item
#    custom: <id>, amount: [min, max]          Custom Item aus custom-items.yml (z.B. kristall, drachenkern)
#    key: <crate>, amount: [min, max]          Crate-Schluessel als Item (vote, daily, rare, epic, legendary)
#    money: [min, max]                         MineCoins (direkt gutgeschrieben)
#    gems: [min, max]                          Gems (direkt gutgeschrieben)
#    book: true                                zufaelliges verzaubertes Buch
#    drachen: true                             zufaelliges Teil der Drachen-Ausruestung
#    worlds: [nether] oder [farmwelt]          nur dort (sonst ueberall)
# =====================================================================
common-rolls: [2, 4]
bonus:
  selten:    {chance: 0.35, name: '&9Selten'}
  episch:    {chance: 0.10, name: '&5Episch'}
  legendaer: {chance: 0.02, name: '&6&lLegendaer'}

loot:
  gewoehnlich:
    - {item: IRON_INGOT, amount: [4, 12], weight: 10}
    - {item: GOLD_INGOT, amount: [3, 9], weight: 8}
    - {item: COPPER_INGOT, amount: [8, 20], weight: 5, worlds: [farmwelt]}
    - {item: COAL, amount: [8, 24], weight: 8, worlds: [farmwelt]}
    - {item: REDSTONE, amount: [8, 24], weight: 6}
    - {item: LAPIS_LAZULI, amount: [6, 18], weight: 6}
    - {item: COOKED_BEEF, amount: [6, 14], weight: 7}
    - {item: GOLDEN_CARROT, amount: [4, 10], weight: 5}
    - {item: ARROW, amount: [12, 32], weight: 5}
    - {item: EXPERIENCE_BOTTLE, amount: [4, 12], weight: 7}
    - {item: OBSIDIAN, amount: [2, 6], weight: 4}
    - {item: SLIME_BALL, amount: [3, 8], weight: 3, worlds: [farmwelt]}
    - {money: [150, 600], weight: 8}
    - {item: QUARTZ, amount: [12, 32], weight: 8, worlds: [nether]}
    - {item: GOLD_NUGGET, amount: [12, 36], weight: 6, worlds: [nether]}
    - {item: BLAZE_ROD, amount: [2, 6], weight: 5, worlds: [nether]}
    - {item: MAGMA_CREAM, amount: [2, 6], weight: 3, worlds: [nether]}
    - {item: NETHER_WART, amount: [4, 12], weight: 4, worlds: [nether]}
    - {item: GLOWSTONE_DUST, amount: [8, 20], weight: 4, worlds: [nether]}
  selten:
    - {item: DIAMOND, amount: [1, 3], weight: 10}
    - {item: EMERALD, amount: [3, 8], weight: 7}
    - {item: GOLDEN_APPLE, amount: [1, 3], weight: 7}
    - {item: ENDER_PEARL, amount: [2, 6], weight: 6}
    - {book: true, weight: 8}
    - {item: NAME_TAG, amount: [1, 2], weight: 3}
    - {item: SADDLE, amount: [1, 1], weight: 2}
    - {money: [800, 2500], weight: 8}
    - {key: vote, amount: [1, 2], weight: 6}
    - {item: GHAST_TEAR, amount: [1, 3], weight: 4, worlds: [nether]}
    - {item: NETHERITE_SCRAP, amount: [1, 1], weight: 4, worlds: [nether]}
    - {item: ANCIENT_DEBRIS, amount: [1, 2], weight: 3, worlds: [nether]}
  episch:
    - {item: DIAMOND, amount: [4, 8], weight: 8}
    - {key: rare, amount: [1, 1], weight: 8}
    - {key: epic, amount: [1, 1], weight: 3}
    - {custom: kristall, amount: [2, 5], weight: 7}
    - {gems: [5, 15], weight: 6}
    - {item: TOTEM_OF_UNDYING, amount: [1, 1], weight: 4}
    - {item: NETHERITE_SCRAP, amount: [2, 3], weight: 4}
    - {custom: drachenkern, amount: [1, 1], weight: 3}
    - {money: [3000, 7500], weight: 6}
  legendaer:
    - {key: legendary, amount: [1, 1], weight: 6}
    - {item: ENCHANTED_GOLDEN_APPLE, amount: [1, 2], weight: 5}
    - {item: NETHERITE_INGOT, amount: [1, 2], weight: 5}
    - {gems: [25, 60], weight: 4}
    - {custom: staubsauger, amount: [1, 1], weight: 2}
    - {custom: enterhaken, amount: [1, 1], weight: 2}
    - {drachen: true, weight: 2}
    - {money: [15000, 30000], weight: 3}
