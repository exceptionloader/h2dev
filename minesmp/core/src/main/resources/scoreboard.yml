# =====================================================================
#  MineSMP - Scoreboard, Info-Leiste, Hotbar-Info und Tablist
#  Farben: &0-&f, &l fett, &#RRGGBB Hex, Farbverlauf: <g:#55FFFF:#4F7CFF>Text</g> (2+ Farben)
#  Rechte Spalte im Scoreboard: alles nach <r> steht rechtsbuendig.
#  Platzhalter: %online% %max_players% %balance% %kills% %deaths% %kd% %killstreak% %level% %clan% %clan_tag%
#  %clan_level% %rank_short% %bounty% %event% %combat% %bp_tier% %daily_streak% %coords% %direction% %world%
#  %time% %next_event% %next_event_in% %ping% %tps% %playtime% %keys_vote% %gems% %stars% %keyall% %raid%
#  %claims% %claim_owner% %poi% ... (PlaceholderAPI geht auch)
# =====================================================================
design-version: 8
update-ticks: 20

# Titel mit fliessendem Farbverlauf (laeuft unabhaengig vom Rest alle 3 Ticks)
title-gradient:
  enabled: true
  text: 'ᴍɪɴᴇsᴍᴘ'
  colors: ['#55FFFF', '#3FA9FF', '#FFFFFF']
  bold: true
  speed: 0.035
# Nur genutzt, wenn title-gradient.enabled false ist
title-frames:
  - '&b&lMINE&f&lSMP'

lines:
  - '&8'
  - ' &a$ &fGeld &a%balance%'
  - ' &c◆ &fGems &d%gems%'
  - ' &e★ &fStars &e%stars%'
  - ' &7⚔ &fKills &6%kills%'
  - ' &c☠ &fTode &#FF7B6B%deaths%'
  - ' &6▣ &fClan &6&l%clan_tag%'
  - ' &d≋ &fPing &d%ping%ms'
  - ' &b✪ &fKeyall &b%keyall%'
  - ' &a◷ &fSpielzeit &a%playtime_short%'
  - '&7'
  - ' &#FF6A3D&lMINESMP.DE'
  - ' &a%online%/%max_players%'
  - '&f'

# ---- Version mit Ressourcenpaket (Logo, farbige Kaestchen, Icons) ----
# Kuerzel: :logo: :profil: :kampf: :clan: :server: :event: :daily: :vote: :combat: :web:
#          :coin: :star: :sword: :skull: :shield: :people: :crown: :pin: :clock: :heart: :bolt: :arrow: :dot: :gem: :key:
#          :dollar: :rubin: :swords: :skullred: :clanicon: :wifi: :keyblue: :clockgreen:
# Spieler ohne Paket sehen automatisch die Text-Version oben (lines / combat-lines).
title-pack: ':board:'
# Genau 15 Zeilen, damit der Rahmen passt. :sp8: = Abstand zum rechten Rand.
lines-pack:
  - '&0'
  - ' &f:dollar: &fGeld &a%balance%'
  - ' &f:rubin: &fGems &d%gems%'
  - ' &f:star: &fStars &e%stars%'
  - ' &f:swords: &fKills &6%kills%'
  - ' &f:skullred: &fTode &#FF7B6B%deaths%'
  - ' &f:clanicon: &fClan &6&l%clan_tag%'
  - ' &f:wifi: &fPing &d%ping%ms'
  - ' &f:keyblue: &fKeyall &b%keyall%'
  - ' &f:clockgreen: &fSpielzeit &a%playtime_short%'
  - '&1'
  - ' &#FF6A3D&lMINESMP.DE'
  - ' &a%online%/%max_players%'
  - '&2'
  - '&3'
combat-lines-pack:
  - '&0'
  - ' :combat:'
  - '&1'
  - ' :clock: &7Noch<r>&c%combat%:sp8:'
  - ' :bolt: &7Streak<r>&6%killstreak%:sp8:'
  - ' :sword: &7Kills<r>&c%kills%:sp8:'
  - ' :coin: &7Kopfgeld<r>&a%bounty%:sp8:'
  - ' :heart: &7Leben<r>&c%health%:sp8:'
  - '&2'
  - ' &c&oNicht ausloggen!'
  - '&3'
  - '&4'
  - ' <g:#55FFFF:#4F7CFF>&lMINESMP.DE</g>'
  - '&5'
  - '&6'

# Waehrend Combat-Tag
combat-lines:
  - '&8'
  - '<g:#FF5555:#FFAA00>&lɪᴍ ᴋᴀᴍᴘꜰ</g>'
  - ' &8▪ &7ɴᴏᴄʜ<r>&c%combat%'
  - '&7'
  - ' &8▪ &7sᴛʀᴇᴀᴋ<r>&6%killstreak% &e✹'
  - ' &8▪ &7ᴋɪʟʟs<r>&c%kills% &4⚔'
  - ' &8▪ &7ᴋᴏᴘꜰɢᴇʟᴅ<r>&a%bounty% &2⛃'
  - '&f'
  - '&c&oɴɪᴄʜᴛ ᴀᴜsʟᴏɢɢᴇɴ!'
  - '&3'
  - '<g:#4F7CFF:#55FFFF:#FFFFFF>ᴍɪɴᴇsᴍᴘ.ᴅᴇ</g>'

tab:
  # Eintrag in der Spielerliste: <prefix><Name><suffix>. Spieler mit Ressourcenpaket sehen prefix-pack (Abzeichen als Grafik).
  # Platzhalter wie im Namensschild (ranks.yml): {icon} {check} {badge} {text} {clan} {afk}
  prefix-pack: '{icon}{check}{badge} &8| '
  prefix: '{check}{text} &8| '
  suffix: '{clan}{afk}'
  frame-count: 1
  header-frames:
    0:
      - ' '
      - '<g:#55FFFF:#3FA9FF:#FFFFFF>&lᴍɪɴᴇsᴍᴘ</g>'
      - ' '
      - '&7Online: &b%online%&7/&b%max_players%'
      - ' '
  header-pack:
    - ' '
    - ':logo:'
    - ' '
    - '&7Online: &b%online%&7/&b%max_players%'
    - ' '
  footer:
    - ' '
    - '&7Discord: &bdiscord.gg/minesmp'
    - '&7Bei Fragen: &b/help &8┃ &7Shop: &bstore.minesmp.de'
    - '&7Regelbrecher gefunden? &b/report'
    - ' '

# Reihenfolge im Tab (LuckPerms-Gruppen, oben = zuerst)
sort-groups: [owner, admin, developer, moderator, supporter, builder, premium, legende, mvp, vip, default]

# Info-Leiste oben (Bossbar). Eintraege wechseln, die Leiste laeuft pro Eintrag ab.
# Waehrend Events/Clan-Kriegen wird deren Bossbar gezeigt. Farben: BLUE GREEN PINK PURPLE RED WHITE YELLOW
infobar:
  enabled: true
  entries:
    - {text: '<g:#55FFFF:#FFFFFF>&lᴍɪɴᴇsᴍᴘ</g> &8┃ &7ᴏɴʟɪɴᴇ &f%online% &8┃ &7ᴅɪsᴄᴏʀᴅ &b/discord', text-pack: ':logo: &7Online &f%online% &8┃ &7Discord &b/discord', seconds: 15, color: BLUE}
    - {text: '&d&lᴇᴠᴇɴᴛ &8┃ &f%next_event% &7ɪɴ &d%next_event_in%', text-pack: ':event: &f%next_event% &7in &d%next_event_in%', seconds: 15, color: PURPLE}
    - {text: '&a&lᴅᴀɪʟʏ &8┃ &7ʙᴇʟᴏʜɴᴜɴɢ ᴀʙʜᴏʟᴇɴ &a/daily &8┃ &7sᴛʀᴇᴀᴋ &f%daily_streak%', text-pack: ':daily: &7Belohnung abholen &a/daily &8┃ &7Streak &f%daily_streak%', seconds: 12, color: GREEN}
    - {text: '&b&lᴄʟᴀɴ &8┃ &f%clan% &8┃ &7ʟᴇᴠᴇʟ &e%level% &8┃ &7ʙᴀᴛᴛʟᴇᴘᴀss &d%bp_tier%', text-pack: ':clan: &f%clan% &8┃ :star: &7Level &e%level% &8┃ &7Pass &d%bp_tier%', seconds: 12, color: BLUE}
    - {text: '&6&lᴋᴇʏᴀʟʟ &8┃ &7ɪɴ &6%keyall% &8┃ &7ɢᴇᴍs &d%gems% &8┃ &7sᴛᴇʀɴᴇ &e%stars%', text-pack: ':key: &7Keyall in &6%keyall% &8┃ :gem: &d%gems% &8┃ :star: &e%stars%', seconds: 12, color: YELLOW}
    - {text: '&c&lʀᴀɪᴅ-ᴢᴇɪᴛ &8┃ %raid% &8┃ &7ɢʀᴜɴᴅsᴛᴜᴇᴄᴋ &b/claim', text-pack: ':shield: &7Raid-Zeit %raid% &8┃ &7Grundstueck sichern &b/claim', seconds: 10, color: RED}
    - {text: '&e&lᴠᴏᴛᴇ &8┃ &7ꜰʀᴇɪᴇ sᴄʜʟᴜᴇssᴇʟ ᴍɪᴛ &e/vote', text-pack: ':vote: &7Freie Schluessel mit &e/vote', seconds: 12, color: YELLOW}

# Dauerhafte Info ueber der Hotbar (Actionbar). Kampf-, Teleport- und Einnahmen-Meldungen haben Vorrang.
actionbar:
  enabled: true
  text: '&a⛃ &f%balance%  &8┃  &b✦ &f%coords%  &8┃  &e➤ &f%direction%  &8┃  &7%world%'
  text-pack: ':coin: &f%balance%   :pin: &f%coords%   :arrow: &f%direction%   :clock: &f%time%'
