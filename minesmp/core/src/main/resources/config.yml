# =====================================================================
#  MineSMPCore - Hauptkonfiguration   (minesmp.de)
#  Farbcodes: &0-&f, &l fett, &#RRGGBB fuer Hex-Farben
#  Nach Aenderungen: /minesmp reload (Nachrichten/Shop/Crates/Kits/Events/Scoreboard)
#  Alles andere: Server-Neustart
# =====================================================================

database:
  # sqlite (Standard, keine Einrichtung noetig) oder mariadb (fuer groessere Server)
  type: sqlite
  file: minesmp.db
  host: localhost
  port: 3306
  name: minesmp
  user: minesmp
  password: ''
  pool-size: 6
  autosave-minutes: 5

# Befehle, die NICHT registriert werden sollen (z.B. wenn ein anderes Plugin sie liefert)
disabled-commands: []
# Eigene Aliase (z.B. /tell, /w, /r) ueberschreiben Vanilla-Befehle gleichen Namens
override-aliases: true

# Anzeigenamen der Welten (Platzhalter %world%)
world-names:
  world: Survival
  world_nether: Nether
  world_the_end: End
  spawn: Spawn
  farmwelt: Farmwelt

# Ressourcenpaket (Logo, Kaestchen und Icons fuer Scoreboard, Tab, Leiste oben, Hotbar-Info)
# Der Server liefert es selbst ueber einen kleinen Webserver aus (Port unten).
# host: Adresse, unter der Spieler den Server erreichen ("localhost" = nur dein eigener PC).
# url: Wenn du das Paket woanders hochlaedst (z.B. Dropbox-Direktlink), hier eintragen - dann kein eigener Webserver.
resource-pack:
  enabled: true
  host: localhost
  port: 8163
  url: ''
  required: false
  prompt: '&b&lMINE&f&lSMP &7- Lade das Paket fuer Scoreboard-Design und Icons.'
  keep-custom-file: false

links:
  discord: https://discord.gg/minesmp
  website: https://minesmp.de
  store: https://store.minesmp.de

# Wird von /setspawn gesetzt (Format: welt;x;y;z;yaw;pitch)
spawn: ''

worlds:
  spawn: spawn
  create-spawn-world: true
  survival: [world, world_nether, world_the_end]
  sleep-percentage: 30
  farmworld:
    enabled: true
    name: farmwelt
    border: 6000
    reset-day: SUNDAY
    reset-time: '04:00'

# MineSMP-Spawn (Bauplan im Plugin). auto: beim ersten Start automatisch bauen, wenn die Spawn-Welt noch leer ist.
# Neu bauen: /minesmp buildspawn confirm
spawn-build:
  auto: true
  # Spawn-Karte: auto = Burg-Insel "High Crown Medieval Spawn" (von OrioniX, SchemsFactory), wenn WorldEdit da ist und die
  #   Datei geladen werden kann - sonst der eingebaute Spawn. builtin = immer der eingebaute Spawn.
  #   Die Karten-Datei wird nicht mitgeliefert (Weitergabe ist nicht erlaubt), sondern beim ersten Start von der Seite
  #   des Erbauers geladen: https://schemsfactory.com/schematics/high-crown-medieval-spawn/
  #   Manuell: Datei nach plugins/MineSMPCore/schematics/high-crown-medieval-spawn.schem legen.
  map: auto
  download-map: true
  auto-update: true       # neuen Spawn-Bauplan aus einem Plugin-Update automatisch bauen (ueberschreibt den alten Spawn)
  blocks-per-tick: 30000

# Grosse Schilder am Spawn: MINESMP-Logo in der Luft und Bereichs-Schilder (MARKT, HANDEL, KISTEN, FORTSCHRITT, GRUFT ...).
# Grafiken aus dem MineSMP-Ressourcenpaket; Positionen und Groesse im Spawn-Layout (Liste "signs").
spawn-signs:
  enabled: true
  bob: true             # Schilder mit bob: true (das Logo) schweben langsam auf und ab
  view-range: 4.0       # Sichtweite (1.0 = normale Entfernung fuer Anzeigen, 4.0 = sehr weit)

# Navigator-Kompass: liegt nur in der Spawn-Welt in der Hotbar (Rechtsklick = /navi) und verschwindet beim Verlassen.
# slot: 1-9 (9 = letzter Platz). Nicht waehrend Duellen, in der PvP-Arena oder in der Gruft. Abschaltbar in /settings.
spawn-compass:
  enabled: true
  slot: 9
  name: '&b&lNavigator &8┃ &7Rechtsklick'

# Winter am Spawn: Schnee auf dem Boden, Schneefall, Weihnachtsbaum, Weihnachtsmann und leise Weihnachtslieder.
# An/aus im Spiel: /minesmp winter on|off  (entfernt Schnee und Baum wieder komplett)
winter:
  enabled: true
  snow-ground: true          # Schneedecke auf allen freien Flaechen
  snowfall: true             # es schneit (Wetter nur in der Spawn-Welt)
  tree: true                 # Weihnachtsbaum mit Lichtern und Geschenken
  santa: true                # Weihnachtsmann neben dem Baum
  santa-command: daily       # Befehl beim Anklicken (taegliche Belohnung)
  time: 12200                # Tageszeit am Spawn (12200 = Abenddaemmerung, 6000 = heller Mittag, 13000 = fast Nacht)
  music: true                # Weihnachtslieder aus Glockentoenen (jeder Spieler kann sie in /settings abschalten)
  music-volume: 0.25         # 0.0 bis 1.0 - bewusst leise
  music-pause-seconds: 25    # Pause zwischen zwei Liedern

spawn-particles:
  enabled: true

teleport:
  warmup-seconds: 3
  tpa-timeout-seconds: 60
  spawn-on-join: false

homes:
  default-max: 3          # mehr ueber minesmp.homes.<n>
  blocked-worlds: [spawn]

pwarps:
  default-max: 1          # mehr ueber minesmp.pwarp.limit.<n>
  cost: 5000

rtp:
  worlds: [world, world_nether]
  default-world: world
  min-radius: 500
  max-radius: 5000
  cooldown-seconds: 300

cooldowns:
  tpa: 15
  repair: 600
  report: 60

repair:
  cost-per-item: 0

economy:
  currency-symbol: MC
  start-balance: 500
  max-balance: 1000000000000
  pay-minimum: 1
  pay-confirm-above: 100000
  log-transactions: true
  # Verkaufs-Multiplikator ueber Berechtigung minesmp.sell.multiplier.<name>
  sell-multipliers:
    vip: 1.1
    mvp: 1.2
    legende: 1.3
    premium: 1.35

# Zweitwaehrungen: Gems (Store/Events, /gemshop) und Sterne (aktive Spielzeit, /sterneshop)
tokens:
  gems:
    allow-pay: true
  stars:
    allow-pay: false
    minutes-per-reward: 30      # alle X Minuten aktive Spielzeit (AFK zaehlt nicht) ...
    playtime-reward: 1          # ... gibt es so viele Sterne (+ minesmp.stars.bonus.<n>)

# Keyall: alle Online-Spieler bekommen Schluessel (Countdown im Scoreboard: %keyall%)
keyall:
  enabled: true
  interval-minutes: 60          # ab Mitternacht gerechnet (60 = jede volle Stunde)
  min-online: 1
  skip-afk: true
  warn-seconds: [300, 60, 10, 3, 2, 1]
  display: '&e1x Vote-Schluessel &7+ &e1 Stern'
  reward:
    keys: {vote: 1}
    stars: 1

# Kaufauftraege (/order)
orders:
  max-per-player: 5             # mehr ueber minesmp.orders.limit.<n>
  max-amount: 100000
  duration-hours: 72
  announce-above: 100000
  blocked-items: [BEDROCK, BARRIER, COMMAND_BLOCK, STRUCTURE_BLOCK, SPAWNER, TRIAL_SPAWNER, VAULT, END_PORTAL_FRAME]

# Mitspieler-Suche (/mitspieler <Text>)
lfg:
  minutes: 20
  cooldown-seconds: 300

# Grundstuecke (/claim) - Chunk-basiert
claims:
  worlds: [world, world_nether, world_the_end]
  default-max: 9                # mehr ueber minesmp.claims.<n>
  free-chunks: 1
  cost-per-chunk: 2500
  min-distance-from-spawn: 150
  clan-trust: true              # Clan-Mitglieder duerfen automatisch bauen
  # Raid-Zeit: TNT-Explosionen und fremde Kisten sind in Grundstuecken erlaubt (Format: TAG|DAILY HH:mm-HH:mm)
  raid:
    enabled: true
    allow-explosions: true
    allow-containers: true
    windows: ['SATURDAY 19:00-21:00', 'SUNDAY 19:00-21:00']

auction:
  max-listings: 5          # mehr ueber minesmp.ah.limit.<n>
  duration-hours: 48
  listing-fee-percent: 2
  sale-tax-percent: 5
  min-price: 1
  max-price: 1000000000
  blocked-items: [BEDROCK, BARRIER, COMMAND_BLOCK, STRUCTURE_BLOCK, SPAWNER]

trade:
  max-distance: 15

player-shops:
  max-per-player: 20

clans:
  create-cost: 10000
  tag-format: '&8[&b{tag}&8] '
  base-members: 8
  members-per-level: 2
  max-level: 50
  max-allies: 3
  ally-damage: false
  xp-base: 1000
  xp:
    kill: 10
    quest: 20
    per-1000-deposit: 5
    war-win: 500
    league-win: 150
  blocked-names: [admin, mod, team, minesmp, nazi, hitler]
  # Clan-Saison (Rangliste am Spawn). Punkte: Krieg gewonnen 3, unentschieden 1. Neue Saison: /clan season reset
  season:
    name: 'Saison 1'
    end: '2026-12-31 20:00'
    tiers:
      - {points: 0, name: 'Bronze', color: '&6'}
      - {points: 3, name: 'Silber', color: '&7'}
      - {points: 6, name: 'Gold', color: '&e'}
      - {points: 10, name: 'Platin', color: '&b'}
      - {points: 15, name: 'Diamant', color: '&3'}
      - {points: 22, name: 'Meister', color: '&d'}
      - {points: 30, name: 'Grossmeister', color: '&5'}
      - {points: 45, name: 'Champion', color: '&c'}
  # Clan-Liga (/clanduell): gewertete Clan-Duelle mit Wertung, Raengen, Aufstellung und Match-Suche.
  # Die Arena-Positionen kommen aus dem Spawn-Bauplan (oder: clans.league.arenas.<name>.pos1 / pos2 im Format welt;x;y;z;yaw;pitch).
  league:
    enabled: true
    team-size: 3              # Spieler pro Clan im Match
    placement-matches: 5      # so viele Matches bis zum ersten Rang
    start-rating: 1000
    k-factor: 32              # wie stark ein Match die Wertung aendert
    k-factor-placement: 60
    kit: duel_netherite       # festes Kit aus kits.yml (das eigene Inventar wird gesichert)
    max-minutes: 6
    rematch-cooldown-minutes: 10
    ranks:
      - {rating: 0,    name: 'Bronze I',      color: '&#C8813C', icon: league_1,  material: COPPER_INGOT}
      - {rating: 900,  name: 'Bronze II',     color: '&#C8813C', icon: league_2,  material: COPPER_BLOCK}
      - {rating: 980,  name: 'Silber I',      color: '&#C9D1D9', icon: league_3,  material: IRON_INGOT}
      - {rating: 1060, name: 'Silber II',     color: '&#C9D1D9', icon: league_4,  material: IRON_BLOCK}
      - {rating: 1140, name: 'Gold I',        color: '&#FFC83D', icon: league_5,  material: GOLD_INGOT}
      - {rating: 1230, name: 'Gold II',       color: '&#FFC83D', icon: league_6,  material: GOLD_BLOCK}
      - {rating: 1320, name: 'Gold III',      color: '&#FFC83D', icon: league_7,  material: RAW_GOLD_BLOCK}
      - {rating: 1420, name: 'Kristall I',    color: '&#C084FC', icon: league_8,  material: AMETHYST_SHARD}
      - {rating: 1540, name: 'Kristall II',   color: '&#C084FC', icon: league_9,  material: AMETHYST_CLUSTER}
      - {rating: 1680, name: 'Kristall III',  color: '&#C084FC', icon: league_10, material: AMETHYST_BLOCK}
      - {rating: 1850, name: 'Mine-Champion', color: '&#55FFFF', icon: league_11, material: NETHER_STAR}
    arenas: {}
  board:
    enabled: true
    location: ''      # leer = Platz am Spawn aus dem Bauplan (Format welt;x;y;z)
    scale: 1.0
    range: 40
  war:
    enabled: true
    duration-minutes: 30
    min-online: 2
    min-stake: 1000
    max-stake: 1000000
    cooldown-hours: 6

combat:
  tag-seconds: 15
  disable-elytra: true
  punish-kicks: false
  # Nur ohne WorldGuard aktiv (mit WorldGuard: Region-Flag "pvp")
  pvp-disabled-worlds: [spawn]
  blocked-commands: [spawn, home, homes, h, tpa, tpahere, tpaccept, back, rtp, wild, warp, pwarp, pw, farmwelt, fw, ec, enderchest, ah, trade, clan, c, kit, duel, arena, afk, trash, craft, repair, sell, shop]
  kill-reward: 50
  streak-bonus: 10
  streak-announce: [5, 10, 15, 20, 25, 50]
  same-victim-cooldown-minutes: 10
  player-kill-xp: 25

# PvP-Bereich: Warteschlange (/queue) fuer Duelle und Sumo, Kit-Editor (/kiteditor), Kronen nach Siegen (/kronen)
pvp:
  sumo:
    max-seconds: 180
    arenas: {}                # kommt aus dem Spawn-Bauplan (pos1, pos2, min-y)
  crowns:
    - {wins: 5,   name: 'Krone I',        color: '&#C8813C'}
    - {wins: 15,  name: 'Krone II',       color: '&#C9D1D9'}
    - {wins: 30,  name: 'Krone III',      color: '&#FFC83D'}
    - {wins: 60,  name: 'Krone IV',       color: '&#55FFFF'}
    - {wins: 100, name: 'Krone V',        color: '&#C084FC'}
    - {wins: 200, name: 'Kronen-Legende', color: '&#FF5555'}
  crown-reward: {gems: 5, stars: 5}

# PvE-Modus (/gruft): Wellen ueberleben, Laternen entzuenden, Boss besiegen - allein oder als Gruppe.
# Kreaturen: kriecher, grubenschreck, schattenwache, lichtfresser. modifier: darkness = "Lichter aus"
pve:
  enabled: true
  name: '<g:#C084FC:#55FFFF>&lDie Kristallgruft</g>'
  max-players: 4
  rewarded-runs-per-day: 3
  reward-after-limit-money: 1000
  reward-display: '&a15.000 MC, 8 Gems, 5 Sterne, 6 Kristalle, Epic-Schluessel'
  waves:
    - {mobs: {kriecher: 7, grubenschreck: 3}}
    - {title: 'Lichter aus', modifier: darkness, mobs: {kriecher: 8, grubenschreck: 5, schattenwache: 2}}
    - {mobs: {kriecher: 9, grubenschreck: 6, schattenwache: 4}}
  # model/model-scale: 3D-Modell mit BetterModel (sonst sichtbarer Wither-Skelett-Waechter)
  boss: {name: '&5&lGruftwaechter', health: 260, damage: 10, shockwave-damage: 7, model: steintitan, model-scale: 0.16}
  reward: {money: 15000, gems: 8, stars: 5, keys: {epic: 1}, custom-items: ['kristall:6'], bp-xp: 300}
  bonus-rewards:
    - {chance: 0.10, reward: {spawners: {zombie: 1}}, broadcast: '&bZombie-Spawner'}
    - {chance: 0.15, reward: {books: ['zufall:2']}}
    - {chance: 0.04, reward: {custom-items: [gruftlaterne]}, broadcast: '&dGruftlaterne'}

lifesteal:
  enabled: false
  max-extra-hearts: 10
  min-extra-hearts: -5

bounty:
  min: 500

duels:
  max-minutes: 5
  ffa-spawn: ''
  # Arenen: /duel setarena <name> 1|2
  arenas: {}

daily:
  base-money: 250
  per-streak-day: 50
  cycle-days: 7
  rewards:
    3:
      keys: {daily: 1}
    7:
      keys: {rare: 1}
      bp-xp: 100
      gems: 3

vote:
  links:
    - https://minecraft-server.eu/vote/index/minesmp
    - https://www.minecraft-serverlist.net/vote/minesmp
  party-votes: 50
  reward:
    money: 250
    gems: 1
    keys: {vote: 1}
  party-reward:
    keys: {rare: 1}
    money: 500

afk:
  auto-minutes: 5
  kick-minutes: 30
  kick-min-online: 30

# Vanish fuer das Team: /vanish (komplett unsichtbar, auch der eigene Skin) und /vanishultra (du siehst deinen Skin, Spieler nicht).
# Teammitglieder (minesmp.staff.member oder minesmp.staff.vanish) sehen sich gegenseitig immer.
vanish:
  fake-messages: true      # beim An-/Ausschalten sehen Spieler "hat verlassen" / "ist beigetreten"
  pickup-items: true       # im Vanish Items aufheben
  remember: true           # nach dem Neu-Einloggen weiter im Vanish

# 3D-Modelle (NPCs und Bosse). Braucht das Plugin BetterModel (kostenlos, das Windows-Paket laedt es automatisch).
# Ohne BetterModel: NPCs tragen die Fantasy-Skins aus dem MineSMP-Ressourcenpaket, Bosse sind vergroesserte Monster.
models:
  enabled: true
  npc-skins: true            # Fantasy-Skins fuer die NPCs (aus dem MineSMP-Ressourcenpaket)
  npc-base-scale: 1.3        # mit 3D-Modell: Groesse des unsichtbaren NPC-Koerpers (Name ueber dem Kopf, Klickflaeche)
  pack-file: BetterModel/build.zip   # von BetterModel gebautes Paket (relativ zu plugins/), wird automatisch mitgeschickt
  pack-url: ''               # nur bei eigenem Webspeicher fuer Pakete (resource-pack.url gesetzt): Adresse des Modell-Pakets
  # Welcher Spawn-NPC welche Figur bekommt (NPC-ID: Modell). Modelle: daemon, eisgolem, goblin, haendler, koenig,
  # magier, ork, ritter, skelettkrieger. NPC weglassen = normaler Skin.
  npcs:
    shop: haendler
    sell: haendler
    gemshop: haendler
    sterneshop: haendler
    orders: haendler
    ah: goblin
    pwarp: goblin
    spawner: goblin
    ce: magier
    skills: magier
    quests: magier
    cosmetics: magier
    clan: ritter
    liga: ritter
    claim: ritter
    achievements: ritter
    arena: ork
    sumo: ork
    kiteditor: ork
    kits: ork
    gruft: skelettkrieger
    bounty: daemon
    event: daemon
    keys: eisgolem
    vote: eisgolem
    guide: koenig
    battlepass: koenig
    rewards: koenig

bosses:
  max-minions: 8             # hoechstens so viele Diener (Totengeister, Spinnen) gleichzeitig pro Boss

# Report-System: /report oeffnet ein Menue (Spieler melden / Bug melden). Das Team bekommt eine Chat-Nachricht
# mit [Annehmen] (teleportiert zum Spieler) und [Ablehnen]; Teammitglieder sehen in /report alle offenen Reports.
reports:
  max-open: 3                # so viele offene Reports darf ein Spieler gleichzeitig haben
  vanish-on-accept: true     # Teammitglied wird beim Annehmen eines Spieler-Reports unsichtbar (wenn es /vanish darf)
  # text: true = der Spieler beschreibt den Grund danach im Chat
  player-reasons:
    - {name: 'Hacking / Cheating', icon: DIAMOND_SWORD}
    - {name: 'Beleidigung', icon: OAK_SIGN}
    - {name: 'Spam / Werbung', icon: PAPER}
    - {name: 'Griefing', icon: TNT}
    - {name: 'Bugusing', icon: SPIDER_EYE}
    - {name: 'Betrug / Scam', icon: GOLD_INGOT}
    - {name: 'Name oder Skin', icon: NAME_TAG}
    - {name: 'Sonstiges', icon: FEATHER, text: true}
  # Bei Bugs wird immer nach einer kurzen Beschreibung im Chat gefragt
  bug-categories:
    - {name: 'Spielfehler / Glitch', icon: SPIDER_EYE}
    - {name: 'Items oder Geld verloren', icon: CHEST}
    - {name: 'Shop / Auktionshaus', icon: EMERALD}
    - {name: 'Clan / Grundstueck', icon: SHIELD}
    - {name: 'Spawn / Welt', icon: GRASS_BLOCK}
    - {name: 'Befehl funktioniert nicht', icon: COMMAND_BLOCK}
    - {name: 'Sonstiges', icon: FEATHER}

# Anti-Cheat-Waechter ("KI-System"): erkennt Cheater automatisch und bannt sie permanent.
# Was er sieht: X-Ray (Fundrate versteckter Erze), Zugriffe durch Waende (Freecam/Ghost-Hand), Hack-Clients (Alarme von GrimAC).
# Was kein Server sehen kann: reines Zuschauen mit Freecam. X-Ray wird zusaetzlich von Paper verhindert (paper-world-defaults.yml -> anti-xray).
# Befehle: /guard, /guard check <Spieler>, /guard cases, /guard case <Nr>, /guard reset <Spieler>. Entbannen: /unban <Spieler>
guard:
  enabled: true
  name: 'KI-System'          # Name, der im Chat und im Strafverlauf als Ausloeser steht
  action: ban                # ban = automatisch permanent bannen | alert = nur das Team warnen
  ban-at: 95                 # ab dieser Sicherheit (0-100) wird gebannt
  alert-at: 60               # ab dieser Sicherheit bekommt das Team eine Warnung
  ban-reason: 'Cheating ({type}) - erkannt vom KI-System, Fall #{case}'
  xray:
    enabled: true
    max-y: 16                # Oberwelt: nur Abbau bis zu dieser Hoehe zaehlt (Diamanten); im Nether zaehlt alles (Antiker Schrott)
    window-blocks: 1500      # groesstes betrachtetes Fenster (zusaetzlich die letzten 300, 600 und 1000 Bloecke)
    min-veins: 10            # fruehestens ab so vielen versteckten Adern wird ueberhaupt bewertet
    legit-rate:              # grosszuegige Obergrenze fuer ehrliches Minen: versteckte Adern pro 1000 abgebaute Bloecke
      diamond: 20
      debris: 12
  freecam:
    enabled: true
    window-minutes: 15
    alert-hits: 4            # so viele VERSCHIEDENE Behaelter durch eine Wand geoeffnet -> Warnung
    ban-hits: 10             # ... -> Bann
  grim:
    enabled: true            # Alarme von GrimAC einbeziehen (Fly, Speed, Killaura, Reichweite ...)
    auto-setup: true         # traegt den Meldebefehl einmalig in plugins/GrimAC/punishments.yml ein (mit Sicherung)
    window-minutes: 30
    # Gewicht je Kategorie (0-1). Eine Kategorie allein reicht nie fuer einen Bann, erst zwei unabhaengige zusammen.
    weights: {reach: 0.85, combat: 0.8, knockback: 0.85, movement: 0.75, packets: 0.7, autoclicker: 0.5, post: 0.3, misc: 0.5}
  # Optionale Gegenpruefung durch ein echtes KI-Modell (Claude von Anthropic, kostenpflichtig, eigener API-Schluessel noetig):
  # gebannt wird dann nur, wenn Statistik UND KI zustimmen. Uebertragen werden nur Messwerte - keine Namen, keine IPs.
  ai:
    enabled: false
    api-key: ''              # Schluessel von console.anthropic.com
    model: claude-opus-5-5
    min-confidence: 85       # die KI muss mindestens so sicher sein
    on-error: alert          # KI nicht erreichbar: alert = nur Team warnen | ban = Statistik entscheidet allein

punishments:
  # Automatische Strafe ab X aktiven Verwarnungen
  warn-escalation:
    3: {type: MUTE, duration: 1h}
    5: {type: BAN, duration: 1d}
    7: {type: BAN, duration: 7d}

security:
  max-accounts-per-ip: 3
  antibot:
    window-seconds: 10
    max-new-joins: 8
    lockdown-seconds: 120
  blocked-commands: [pl, plugins, ver, version, about, icanhasbukkit, bukkit:pl, bukkit:plugins, me, minecraft:me]

chat:
  format: '{prefix}{clan}&f{name} &8» &f{message}'
  # Fuer Spieler mit Ressourcenpaket: Rang-Abzeichen statt Text-Praefix ({badge}, {name} im Rang-Format)
  format-pack: '{badge} {clan}{name} &8» &f{message}'
  default-prefix: '&7'
  delay-ms: 1500
  max-caps-ratio: 0.6
  allowed-domains: [minesmp.de, discord.gg/minesmp]
  blocked-words: []

custom-items:
  treefeller-requires-sneak: true
  treefeller-max: 96
  crystal-chance-ore: 0.03       # Chance auf einen Mine-Kristall pro Erz (ohne Behutsamkeit)
  crystal-chance-debris: 0.25
  vacuum-radius: 6
  grapple-cooldown-ms: 2000
  grapple-in-combat: false

# Schatzkisten im Nether und in der Farmwelt (/schatz). Inhalt: treasure.yml.
# Sehr selten steckt der Schatz-Token darin: {days} Tage alle Crates gratis (so oft man will) + Rang (Standard: MVP).
treasure:
  enabled: true
  worlds:                        # Welt: Kisten je Spieler in der Welt, hoechstens max
    farmwelt: {per-player: 6, max: 50}
    world_nether: {per-player: 5, max: 40}
  spawn-interval-seconds: 20
  min-distance: 24               # Abstand zum Spieler beim Erscheinen (Bloecke)
  max-distance: 110
  underground-chance: 0.45       # Farmwelt: Anteil der Kisten in Hoehlen statt an der Oberflaeche
  lifetime-minutes: 45           # danach zerfaellt eine ungeoeffnete Kiste
  particles: true                # leichtes Glitzern, wenn ein Spieler naeher als 24 Bloecke ist
  # Token-Algorithmus (n = Kisten seit dem letzten eigenen Token):
  #   n < min-chests: nie | bis pity-start: base-chance | danach steigt es bis pity-max-chance | ab hard-pity: sicher
  #   Standard: nie vor Kiste 150, ~9 % bis 300, ~37 % bis 800, ~91 % bis 1200, im Schnitt nach ~840 Kisten, sicher bei 1500.
  #   Pruefen mit /schatz admin chance
  token:
    min-chests: 150
    base-chance: 0.0006          # 0,06 % je Kiste
    pity-start: 600
    pity-max-chance: 0.02        # 2 % kurz vor hard-pity
    hard-pity: 1500              # 0 = kein sicherer Fund
    max-per-week: 2              # serverweit in 7 Tagen (0 = unbegrenzt)
    days: 7
    rank: mvp
    rank-command: 'lp user {player} parent addtemp {rank} {days}d accumulate'
    announce-seconds: 15         # goldene Leiste oben fuer alle ("<Name> hat den SCHATZ-TOKEN gefunden!")

# Drachen-Ausruestung "Obsidian & Sturm" (Items: custom-items.yml, Shop: token-shops.yml -> drachen, Befehl /schmiede)
drachen:
  affect-players: false          # Blitz-Zusatzschaden und Frost auch gegen Spieler (normales PvP bleibt unberuehrt)
  adventure-mode: false          # Faehigkeiten auch im Abenteuermodus (sonst nur Ueberleben)
  thunder-cooldown-seconds: 8
  thunder-bonus-damage: 4.0
  frost-cooldown-seconds: 4
  frost-duration-seconds: 3
  area-mining: true              # 3x3 mit Titan-Spitzhacke und Terra-Schaufel
  auto-smelting: true            # Titan-Spitzhacke schmilzt Eisen, Gold, Kupfer
  tree-felling: true
  max-tree-blocks: 12
  recipes: true                  # Drachenkern + Netherit-Teil + Drachenatem = Ausruestung (/schmiede rezepte)
  dragon-drops-core: true        # Enderdrache laesst einen Drachenkern fallen
  broadcast-loot: true           # Chat-Nachricht, wenn jemand ein Teil beim Boss-Event gewinnt
  armor:
    night-vision: true
    speed: true
    full-set-fire-resistance: true
    full-set-resistance: true
    particles: true
  # Gewichte fuer die Boss-Beute (drachen-loot): hoeher = haeufiger
  loot-pool:
    drachen_donnerklinge: 10
    drachen_frostbogen: 10
    titan_spitzhacke: 8
    sturm_axt: 10
    terra_schaufel: 10
    ernte_sichel: 10
    drachen_helm: 10
    drachen_panzer: 6
    drachen_beinschutz: 8
    drachen_stiefel: 10

custom-enchants:
  max-per-item: 4

discord:
  large-payment: 1000000
  # Discord-Webhook-URLs (leer = aus). Kanaele: punishments, reports, events, economy, server
  webhooks:
    punishments: ''
    reports: ''
    events: ''
    economy: ''
    server: ''

