# Custom Items. ability: HAMMER (3x3), TREEFELLER (ganzer Baum, Schleichen), SELLWAND (Rechtsklick auf Truhe = Inhalt verkaufen),
#   VACUUM (Staubsauger: saugt Items ein, Rechtsklick an/aus), SPAWNERPICK (natuerlichen Spawner mitnehmen), GRAPPLE (Enterhaken)
# custom-enchants: eigene Verzauberungen aus enchants.yml (z.B. {vampir: 2})
# uses: Anzahl Nutzungen (SELLWAND, SPAWNERPICK). Vergabe: /msitem <Spieler> <id>, Crates, Shops, Rezepte.
# Rezept-Zutat "custom:<id>" = Custom Item (z.B. custom:kristall)
items:
  hammer:
    material: DIAMOND_PICKAXE
    name: '&b&lMine-Hammer'
    lore: ['&7Baut 3x3 Bloecke auf einmal ab.', '&8MineSMP Custom Item']
    enchantments: {efficiency: 3, unbreaking: 3}
    custom-model-data: 10001
  holzfaeller:
    material: DIAMOND_AXE
    name: '&6&lHolzfaeller-Axt'
    lore: ['&7Schleichen + Abbauen faellt den', '&7ganzen Baum.', '&8MineSMP Custom Item']
    enchantments: {efficiency: 3, unbreaking: 3}
    custom-model-data: 10002
  sellwand:
    material: BLAZE_ROD
    name: '&e&lVerkaufsstab'
    lore: ['&7Rechtsklick auf eine Truhe verkauft', '&7den gesamten Inhalt an den Shop.']
    glow: true
    uses: 50
    custom-model-data: 10003
  spawnfeder:
    material: FEATHER
    name: '&f&lFeder des Wanderers'
    lore: ['&7Ein seltenes Sammlerstueck.', '&8Kosmetisch']
