    glow: true
    custom-model-data: 10013
  phoenix:
    material: ELYTRA
    name: '<g:#FF9E2C:#FF4D4D>&lPhoenix-Fluegel</g>'
    lore: ['&7Eine unzerstoerbare Flugmaschine.', '&8MineSMP Custom Item']
    unbreakable: true
    glow: true
    custom-model-data: 10014
  enterhaken:
