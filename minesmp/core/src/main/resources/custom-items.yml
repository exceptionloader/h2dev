  # Kaufen in der Drachen-Schmiede (/schmiede), gewinnen beim Boss-Event (events.yml -> events.boss.rewards).
  # equipment-asset: Aussehen der getragenen Ruestung (none = 3D-Item-Modell auf dem Kopf)
