    name: '<g:#FFF36B:#FFB13B>&lDonnerklinge</g>'
    lore: ['&8', '&8MineSMP Custom Item']
    enchantments: {sharpness: 5, unbreaking: 3}
    custom-enchants: {donner: 3, vampir: 1}
