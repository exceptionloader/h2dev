    lore: ['&7Eine seltene Trophaee aus der', '&7Kristallgruft. Sie erlischt nie.', '&8Sammlerstueck']
    glow: true
    custom-model-data: 10020
  kristall:
    material: AMETHYST_SHARD
    name: '&d&lMine-Kristall'
    lore: ['&7Selten beim Erze-Abbauen, in Meteoriten', '&7und bei Events. Fuer Verzauberungen (&f/ce&7)', '&7und besondere Rezepte.']
    glow: true
    custom-model-data: 10010
  staubsauger:
    material: HOPPER
    ability: VACUUM
    name: '&d&lStaubsauger'
    lore: ['&7Saugt Items im Umkreis von 6 Bloecken ein,', '&7solange er in deinem Inventar ist.', '&eRechtsklick: &7an/aus', '&8MineSMP Custom Item']
    glow: true
    custom-model-data: 10011
  sternenpicke:
    material: NETHERITE_PICKAXE
    name: '<g:#FFE66B:#FFB13B>&l✦ Sternen-Spitzhacke</g>'
    lore: ['&8', '&7Nur im Sterne-Shop.', '&8MineSMP Custom Item']
