    material: FIRE_CHARGE
    item-model: drachen:drachenkern
    ability: DRACHEN_KERN
    name: '<g:#7CF7FF:#1FB5C9>&lDrachenkern</g>'
    lore: ['&7Seltene Essenz fuer Drachen-Ausruestung.', '&7Beute vom Boss-Event und vom Enderdrachen.', '&7Rezepte: &f/schmiede rezepte', '&8Drachen-Ausruestung']
