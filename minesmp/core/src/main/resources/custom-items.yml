    custom-enchants: {bohrer: 1, telekinese: 1, autoschmelze: 1, erfahrung: 2}
    custom-model-data: 10012
  spawnerpicke:
    material: GOLDEN_PICKAXE
    ability: SPAWNERPICK
    name: '&c&lSpawner-Spitzhacke'
    lore: ['&7Baut einen natuerlichen Spawner ab', '&7und gibt ihn dir als Spawner-Item.', '&8MineSMP Custom Item']
