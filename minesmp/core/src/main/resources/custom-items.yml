recipes:
  # Eigenes Rezept: Sattel
  sattel:
    result: {material: SADDLE}
    shape: ['LLL', 'LSL', 'I I']
    ingredients: {L: LEATHER, S: STRING, I: IRON_INGOT}
  # Eigenes Rezept: Namensschild
  namensschild:
    result: {material: NAME_TAG}
    shape: ['  S', ' P ', 'P  ']
    ingredients: {S: STRING, P: PAPER}
  # Formloses Rezept: Seelensand
  seelensand:
    result: {material: SOUL_SAND, amount: 2}
    ingredients: [SAND, NETHERRACK]
  # Verkaufsstab craftbar
  verkaufsstab:
    result-custom: sellwand
    shape: [' G ', ' B ', ' B ']
    ingredients: {G: GOLD_BLOCK, B: BLAZE_ROD}
  # Staubsauger aus Kristallen
  staubsauger:
    result-custom: staubsauger
    shape: ['KKK', 'KHK', 'KKK']
    ingredients: {K: 'custom:kristall', H: HOPPER}
  # Enterhaken: Angel + Kristalle
  enterhaken:
    result-custom: enterhaken
    shape: [' KK', ' AK', 'K  ']
    ingredients: {K: 'custom:kristall', A: FISHING_ROD}
