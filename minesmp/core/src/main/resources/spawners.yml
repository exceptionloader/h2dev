# =====================================================================
#  Spawner (/spawner): Erzeugen keine Mobs, sondern Drops + XP direkt in einen Speicher.
#  Rechtsklick = Speicher | gleichen Spawner draufklicken = stapeln (Schleichen = ganzer Stapel)
#  Natuerliche Spawner: nur mit der Spawner-Spitzhacke mitnehmen.
#  price: MineCoins im Spawner-Shop (0 = nicht im Shop, nur ueber Gems/Kisten/Events)
#  drops: MATERIAL: {min, max, chance}  (pro Spawner im Stapel und Durchgang)
# =====================================================================
settings:
  interval-seconds: 30
  max-stack: 64
  storage-per-stack: 1728     # max. Items im Speicher je Spawner im Stapel
  xp-per-stack: 5000
  player-radius: 0            # 0 = immer, wenn der Chunk geladen ist; sonst nur mit Spieler in diesem Radius
  worlds: [world, world_nether, world_the_end]

