#  reward: Belohnungsformat (money, gems, stars, keys, items, custom-items, spawners, books, commands, display)
#  permission: optional - nur mit dieser Berechtigung kaufbar
#  Gems gibt es im Store, bei Events, Votes und Keyalls. Sterne fuer aktive Spielzeit.
# =====================================================================
