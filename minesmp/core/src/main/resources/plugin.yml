name: MineSMPCore
version: '${project.version}'
main: de.minesmp.core.MineSMP
api-version: '1.21'
description: Kern-Plugin des deutschen SMP-Servers MineSMP (Economy, Clans, PvP, Crates, Quests, Events u.v.m.)
author: MineSMP
website: https://minesmp.de
softdepend: [Vault, PlaceholderAPI, LuckPerms, Votifier, WorldGuard]
# Wird beim Start von Maven Central geladen (Paper Library Loader)
libraries:
  - com.zaxxer:HikariCP:6.2.1
  - org.xerial:sqlite-jdbc:3.47.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.5.1
# Befehle werden dynamisch registriert (siehe docs/COMMANDS.md), Berechtigungen siehe docs/PERMISSIONS.md
permissions:
  minesmp.player:
    description: Alle Standard-Spielerrechte
    default: true
    children:
      minesmp.money: true
      minesmp.pay: true
      minesmp.baltop: true
      minesmp.shop: true
      minesmp.sell: true
      minesmp.sell.all: true
      minesmp.ah: true
      minesmp.trade: true
      minesmp.playershop.create: true
      minesmp.clan: true
      minesmp.bounty: true
      minesmp.kit: true
      minesmp.kit.starter: true
      minesmp.duel: true
      minesmp.arena: true
      minesmp.crate: true
      minesmp.skills: true
      minesmp.quests: true
      minesmp.achievements: true
      minesmp.battlepass: true
      minesmp.daily: true
      minesmp.rewards: true
      minesmp.event: true
      minesmp.home: true
      minesmp.tpa: true
      minesmp.back: true
      minesmp.spawn: true
      minesmp.rtp: true
      minesmp.farmwelt: true
      minesmp.pwarp: true
      minesmp.afk: true
      minesmp.trash: true
      minesmp.msg: true
      minesmp.ignore: true
      minesmp.playtime: true
      minesmp.info: true
      minesmp.profile: true
      minesmp.stats: true
      minesmp.settings: true
      minesmp.report: true
      minesmp.staff.list: true
      minesmp.vote: true
      minesmp.cosmetics: true
      minesmp.gems: true
      minesmp.stars: true
      minesmp.tokenshop: true
      minesmp.keyall: true
      minesmp.spawners: true
      minesmp.orders: true
      minesmp.lfg: true
      minesmp.claim: true
      minesmp.ce: true
  minesmp.spawn.build:
    description: Darf am Spawn bauen/abbauen
    default: op
  minesmp.admin.spawn:
    description: Darf den Spawn neu bauen (/minesmp buildspawn)
    default: op
  minesmp.admin.clan:
    description: Clan-Saison zuruecksetzen (/clan season reset)
    default: op
  minesmp.admin.tokens:
    description: Gems/Sterne geben, nehmen, setzen (/gems give ...)
    default: op
  minesmp.tokens.others:
    description: Gems/Sterne anderer Spieler ansehen
    default: op
  minesmp.admin.spawners:
    description: Spawner geben und fremde Spawner verwalten
    default: op
  minesmp.admin.claims:
    description: Grundstuecks-Bypass und fremde Chunks freigeben
    default: op
  minesmp.admin.ce:
    description: Verzauberungsbuecher geben (/ce give, /ce add)
    default: op
  minesmp.admin.keyall:
    description: Keyall sofort ausloesen (/keyall now)
    default: op
  minesmp.admin.poi:
    description: Meteorit/Kampfzone starten und stoppen (/poi start|stop)
    default: op
  minesmp.joinfull:
    description: Darf auf den vollen Server (Premium)
    default: false
