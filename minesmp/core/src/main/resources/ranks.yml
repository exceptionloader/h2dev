# =====================================================================
#  MineSMP - Raenge: Abzeichen, Namensschild (auch selbst in F5 sichtbar), Tab-Eintrag und Rang-Partikel
#  Reihenfolge = Prioritaet (oben zuerst). Erkannt ueber die LuckPerms-Gruppe (Recht group.<id>).
#  badge:     Abzeichen aus dem Ressourcenpaket (rank_owner, rank_admin, rank_dev, rank_mod, rank_support,
#             rank_builder, rank_premium, rank_legende, rank_mvp, rank_vip, rank_spieler)
#  icon:      kleiner Edelstein vor dem Abzeichen (Standard: icon_<wie badge>), '' = keiner
#  verified:  Haken [✔] vor dem Rang (Standard: true, bei default false; oder Recht minesmp.verified)
#  text:      Ersatz fuer Spieler ohne Ressourcenpaket
#  name:      Format des Namens im Chat ({name}); Farbverlauf: <g:#AAAAAA:#BBBBBB>{name}</g>
#  particles: none | sparkle (Funkeln) | ring (Ring um die Huefte) | halo (Heiligenschein)
#             | helix (Doppelspirale) | crown (Flammenkrone)
#  colors:    zwei Hex-Farben fuer die Partikel
# =====================================================================
design-version: 2
ranks:
  owner:     {badge: rank_owner,   text: '&4&lOWNER',   name: '<g:#FF6B6B:#FFC46B>&l{name}</g>', particles: crown,   colors: ['#FF4D4D', '#FFC46B']}
  admin:     {badge: rank_admin,   text: '&c&lADMIN',   name: '<g:#FF5555:#FF9A9A>{name}</g>',   particles: halo,    colors: ['#FF5555', '#FFB4B4']}
  developer: {badge: rank_dev,     text: '&d&lDEV',     name: '<g:#C084FC:#F0ABFC>{name}</g>',   particles: halo,    colors: ['#C084FC', '#F0ABFC']}
  moderator: {badge: rank_mod,     text: '&6&lMOD',     name: '&6{name}',                        particles: ring,    colors: ['#F59E0B', '#FDE68A']}
  supporter: {badge: rank_support, text: '&e&lSUPPORT', name: '&e{name}',                        particles: ring,    colors: ['#FACC15', '#FFF3A3']}
  builder:   {badge: rank_builder, text: '&a&lBUILDER', name: '&a{name}',                        particles: sparkle, colors: ['#22C55E', '#BBF7D0']}
  premium:   {badge: rank_premium, text: '&6&lPREMIUM', name: '<g:#FFE66B:#FF9E2C>{name}</g>',   particles: crown,   colors: ['#FFD86B', '#FF9E2C']}
  legende:   {badge: rank_legende, text: '&9&lLEGENDE', name: '<g:#4F7CFF:#55FFFF>{name}</g>',   particles: helix,   colors: ['#4F7CFF', '#55FFFF']}
  mvp:       {badge: rank_mvp,     text: '&3&lMVP',     name: '<g:#22C3D6:#B6F7FF>{name}</g>',   particles: ring,    colors: ['#22C3D6', '#B6F7FF']}
  vip:       {badge: rank_vip,     text: '&b&lVIP',     name: '&b{name}',                        particles: sparkle, colors: ['#8FF3FF', '#FFFFFF']}
  default:   {badge: rank_spieler, text: '&7Spieler',   name: '&f{name}',                        particles: none}

# Haken vor dem Rang ({check})
check:
  pack: '&8[&f:check:&8] '
  text: '&8[&a✔&8] '

# Namensschild ueber dem Kopf (ersetzt das normale Minecraft-Namensschild)
# {icon} {check} {badge} {text} {player} (Name, weiss) {name} (Name im Rang-Format) {clan} {level} {afk}
# sowie alle %platzhalter% (z.B. %balance% %gems% %stars% %kills% %level%)
# Vor Grafiken (:kuerzel:) immer &f setzen, sonst werden sie eingefaerbt.
nametag:
  enabled: true
  line1-pack: '{icon}{check}{badge} &8| &f{player}{clan}{afk}'
  line1: '{check}{text} &8| &f{player}{clan}{afk}'
  line2: '&7Coins: &b%balance%&7, Gems: &b%gems%'
  clan-format: ' &8[&b{tag}&8]'
  afk-format: ' &7[AFK]'
  height: 0.28
  view-range: 0.7

particles:
  enabled: true
  interval-ticks: 2
  range: 32
