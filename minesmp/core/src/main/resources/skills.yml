# Skills: XP und MineCoins pro Aktion. Geld wird alle 30s gesammelt gutgeschrieben.
# Von Spielern platzierte Erze/Staemme geben nichts (Exploit-Schutz). Spawner-Mobs geben nichts.
formula:
  skill-base: 100
  skill-exponent: 1.6
  max-skill-level: 100
  player-base: 250
  player-exponent: 1.5
  max-player-level: 200

vip-xp-multiplier: 1.25          # Berechtigung minesmp.xp.boost
skill-levelup-money-per-level: 100
spawner-mobs-give-no-rewards: true

skills:
  mining:
    name: '&7Mining'
    icon: IRON_PICKAXE
    xp: {STONE: 0.3, DEEPSLATE: 0.4, COAL_ORE: 4, DEEPSLATE_COAL_ORE: 5, COPPER_ORE: 3, DEEPSLATE_COPPER_ORE: 4, IRON_ORE: 6, DEEPSLATE_IRON_ORE: 7,
         GOLD_ORE: 10, DEEPSLATE_GOLD_ORE: 11, NETHER_GOLD_ORE: 5, REDSTONE_ORE: 6, DEEPSLATE_REDSTONE_ORE: 7, LAPIS_ORE: 8, DEEPSLATE_LAPIS_ORE: 9,
         DIAMOND_ORE: 30, DEEPSLATE_DIAMOND_ORE: 32, EMERALD_ORE: 40, DEEPSLATE_EMERALD_ORE: 42, NETHER_QUARTZ_ORE: 4, ANCIENT_DEBRIS: 80, AMETHYST_CLUSTER: 5}
