# Belohnungen beim Erreichen eines Spielerlevels (einmalig)
level-rewards:
  5: {money: 1000, keys: {vote: 1}}
  10: {money: 2500, keys: {rare: 1}}
  20: {money: 5000, keys: {rare: 2}}
  30: {money: 10000, keys: {epic: 1}}
  50: {money: 25000, keys: {epic: 2}, commands: ['lp user {player} permission set minesmp.trail.funken true'], display: '&bSpur: Funken'}
  75: {money: 50000, keys: {legendary: 1}}
  100: {money: 100000, keys: {legendary: 2}, commands: ['lp user {player} permission set minesmp.pet.axolotl true'], display: '&dHaustier: Axolotl'}
