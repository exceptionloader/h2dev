[project]
name = "nova-backend"
version = "0.1.0"
description = "NOVA – gaming & community platform (backend API)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.33",
    "pyjwt>=2.15.1",
    "boto3>=1.43.123",
    "websockets>=17.4",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "moto>=5.2.5",
    "httpx-ws>=0.9.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["rate_limit: run with rate limiting enabled"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"app/core/config.py" = ["S105"]
"tests/**" = ["S105", "S106", "S108", "ASYNC109"]
"alembic/versions/*" = ["E501"]
