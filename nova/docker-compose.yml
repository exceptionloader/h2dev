# Local development stack.
#   docker compose up --build
# App: http://localhost:5173 · API docs: http://localhost:8000/api/docs · Mails: http://localhost:8025

name: nova

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova
      POSTGRES_DB: nova
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d nova"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Voice (WebRTC). Dev mode uses the fixed key pair devkey/secret — never in production.
  livekit:
    image: livekit/livekit-server:v1.9
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"

  # Catches all outgoing mail (password resets) — web UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:8025:8025"

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers"
    environment:
      NOVA_ENVIRONMENT: development
      NOVA_DATABASE_URL: postgresql+asyncpg://nova:nova@db:5432/nova
      NOVA_TEST_DATABASE_URL: postgresql+asyncpg://nova:nova@db:5432/nova_test
      NOVA_ALLOWED_ORIGINS: http://localhost:5173
      NOVA_FRONTEND_URL: http://localhost:5173
      NOVA_STORAGE_LOCAL_PATH: /data/uploads
      NOVA_SMTP_HOST: mailpit
      NOVA_SMTP_PORT: "1025"
      NOVA_SMTP_SECURITY: none
      NOVA_LIVEKIT_URL: ws://localhost:7880
      NOVA_LIVEKIT_API_KEY: devkey
      NOVA_LIVEKIT_API_SECRET: secret
      NOVA_FIRST_PARTY_BOT_TOKEN: nb_dev_only_first_party_bot_token
    volumes:
      - ./backend:/app
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # First-party NOVA Bot: a separate process that only talks to the public API.
  bot:
    build: ./bot
    environment:
      NOVA_API_URL: http://backend:8000
      NOVA_BOT_TOKEN: nb_dev_only_first_party_bot_token
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      NOVA_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  db-data:
  uploads:
  frontend-node-modules:
