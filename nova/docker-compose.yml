# Local development stack: PostgreSQL + FastAPI backend + Vite frontend.
# Start with:  docker compose up --build
# LiveKit (voice), Redis and MinIO (uploads) are added in the milestones that need them.

name: nova

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova
      POSTGRES_DB: nova
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d nova"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers"
    environment:
      NOVA_ENVIRONMENT: development
      NOVA_DATABASE_URL: postgresql+asyncpg://nova:nova@db:5432/nova
      NOVA_TEST_DATABASE_URL: postgresql+asyncpg://nova:nova@db:5432/nova_test
      NOVA_ALLOWED_ORIGINS: http://localhost:5173
      NOVA_FRONTEND_URL: http://localhost:5173
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      NOVA_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  db-data:
  frontend-node-modules:
