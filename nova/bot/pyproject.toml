[project]
name = "nova-bot"
version = "0.1.0"
description = "First-party NOVA bot. Runs as its own process and only uses the public API."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "websockets>=13"]

[dependency-groups]
dev = ["pytest>=8.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
