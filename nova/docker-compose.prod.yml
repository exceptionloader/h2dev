# Production stack for the private beta (single server, e.g. a small VPS).
#   cp .env.prod.example .env.prod   # fill in secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Needs DNS A records for NOVA_DOMAIN and LIVEKIT_DOMAIN pointing to this server and
# open ports 80/443 (web), 7881/tcp and 50000-50100/udp (voice).

name: nova-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: nova
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d nova"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NOVA_ENVIRONMENT: production
      NOVA_DATABASE_URL: postgresql+asyncpg://nova:${POSTGRES_PASSWORD}@db:5432/nova
      NOVA_ALLOWED_ORIGINS: https://${NOVA_DOMAIN}
      NOVA_FRONTEND_URL: https://${NOVA_DOMAIN}
      NOVA_SESSION_COOKIE_SECURE: "true"
      NOVA_LOG_LEVEL: INFO
      NOVA_STORAGE_BACKEND: ${NOVA_STORAGE_BACKEND:-local}
      NOVA_STORAGE_LOCAL_PATH: /data/uploads
      NOVA_S3_BUCKET: ${NOVA_S3_BUCKET:-}
      NOVA_S3_ENDPOINT_URL: ${NOVA_S3_ENDPOINT_URL:-}
      NOVA_S3_REGION: ${NOVA_S3_REGION:-eu-central-1}
      NOVA_S3_ACCESS_KEY: ${NOVA_S3_ACCESS_KEY:-}
      NOVA_S3_SECRET_KEY: ${NOVA_S3_SECRET_KEY:-}
      NOVA_SMTP_HOST: ${NOVA_SMTP_HOST:?set NOVA_SMTP_HOST}
      NOVA_SMTP_PORT: ${NOVA_SMTP_PORT:-587}
      NOVA_SMTP_USERNAME: ${NOVA_SMTP_USERNAME:-}
      NOVA_SMTP_PASSWORD: ${NOVA_SMTP_PASSWORD:-}
      NOVA_MAIL_FROM: ${NOVA_MAIL_FROM:-NOVA <no-reply@example.com>}
      NOVA_LIVEKIT_URL: wss://${LIVEKIT_DOMAIN}
      NOVA_LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY}
      NOVA_LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}
      NOVA_FIRST_PARTY_BOT_TOKEN: ${NOVA_BOT_TOKEN:?set NOVA_BOT_TOKEN}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: ./bot
    restart: unless-stopped
    environment:
      NOVA_API_URL: http://backend:8000
      NOVA_BOT_TOKEN: ${NOVA_BOT_TOKEN}
    depends_on:
      - backend

  livekit:
    image: livekit/livekit-server:v1.9
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881"
      - "50000-50100:50000-50100/udp"

  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      NOVA_DOMAIN: ${NOVA_DOMAIN:?set NOVA_DOMAIN}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN:?set LIVEKIT_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
    depends_on:
      - backend

volumes:
  db-data:
  uploads:
  caddy-data:
